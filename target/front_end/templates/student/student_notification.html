<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webventory: Student Portal - Notifications</title>
    <link rel="stylesheet" href="../../static/css/student_style/notification/student_notification_body.css">
</head>
<body>

    <!-- Sidebar Navigation Drawer Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar Navigation Drawer -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="sidebar-logo">W</div>
                <div>
                    <h3>Webventory</h3>
                    <span>Student</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="close-btn">Close</button>
        </div>
        <div class="sidebar-menu">
            <a href="student_dashboard.html" class="menu-item"><span class="icon">田</span> Dashboard</a>
            <a href="student_browse_item.html" class="menu-item"><span class="icon">📋</span> Browse Items</a>
            <a href="student_my_borrowings.html" class="menu-item"><span class="icon">📦</span> My Borrowings</a>
            <a href="student_history.html" class="menu-item"><span class="icon">⏱️</span> History</a>
            <a href="student_notification.html" class="menu-item active"><span class="icon">🔔</span> Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Top Navigation Header -->
    <header class="header">
        <div class="header-left">
            <button id="menu-btn" class="menu-btn" onclick="toggleSidebar()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span>Menu</span>
            </button>
            <span class="divider">|</span>
            <h1>Webventory: Student Portal</h1>
        </div>
        <div class="header-right">
            <!-- Notification Dropdown Container -->
            <div class="dropdown-container">
                <button class="notification-btn" onclick="toggleNotificationDropdown()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span class="notification-dot" id="notif-dot"></span>
                </button>
                <div id="notification-dropdown" class="dropdown-menu notification-menu">
                    <div class="notif-tabs">
                        <button class="tab-btn active" onclick="switchHeaderNotifTab('all')">All</button>
                        <button class="tab-btn" onclick="switchHeaderNotifTab('unread')">Unread</button>
                        <button class="tab-btn" onclick="switchHeaderNotifTab('alerts')">Alerts</button>
                    </div>
                    <div class="notif-list" id="header-notif-list-container">
                        <!-- Populated by JS -->
                    </div>
                    <div class="notif-footer">
                        <button class="btn-open-notif" onclick="alert('Already on Notifications page')">Open Notifications Page</button>
                    </div>
                </div>
            </div>

            <!-- Profile Dropdown Container -->
            <div class="dropdown-container">
                <div class="profile-section" onclick="toggleProfileDropdown()">
                    <div class="avatar">JD</div>
                    <span>Profile</span>
                </div>
                <div id="profile-dropdown" class="dropdown-menu profile-menu">
                    <a href="student_account_setting.html" class="dropdown-item">Account Settings</a>
                    <a href="../../login_page/index.html" class="dropdown-item text-red">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">

        <!-- Page Top Bar -->
        <div class="page-top-bar">
            <h2>Notifications</h2>
        </div>

        <!-- Notification Filter Tabs -->
        <div class="content-tabs">
            <button class="content-tab-btn active" onclick="switchPageTab('all', event)">All</button>
            <button class="content-tab-btn" onclick="switchPageTab('unread', event)">Unread</button>
            <button class="content-tab-btn" onclick="switchPageTab('alerts', event)">Alerts</button>
        </div>

        <!-- Notifications List Container -->
        <div class="notifications-container" id="notifications-container">
            <!-- Populated by JavaScript -->
        </div>

    </main>

    <script src="../../static/script/student_script/notification/student_notification_all_in_one.js"></script>
    <script src="../../static/script/auth.js?v=1"></script>
    
</body>
</html>
