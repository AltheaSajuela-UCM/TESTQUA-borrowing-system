<!-- File: student_account_setting.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../static/css/student_style/account_setting/student_account_setting_body.css">

    <title>Webventory: Student Portal</title>

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .under-menu-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 14px;
        }
        .back-btn {
            background-color: #174EA6;
            color: #FFFFFF;
            border: none;
            height: 40px;
            padding: 0 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.15s ease;
        }
        .back-btn:hover {
            background-color: #1A73E8;
        }
    </style>
</head>
<body>

    <!-- Left-edge hover trigger zone -->
    <div id="left-edge-hover" class="left-edge-hover"></div>

    <!-- Sidebar Menu Drawer -->
    <aside id="sidebar" class="sidebar closed">
        <div class="sidebar-header">
            <div class="brand-title">
                <span class="logo-icon">W</span>
                <div>
                    <h3>Webventory</h3>
                    <p>Student</p>
                </div>
            </div>
            <button id="close-sidebar-btn" class="close-btn">Close</button>
        </div>
        <nav class="sidebar-nav">
            <a href="student_dashboard.html" class="nav-item">⊞ Dashboard</a>
            <a href="student_browse_item.html" class="nav-item">📋 Browse items</a>
            <a href="student_my_borrowings.html" class="nav-item">📦 My Borrowings</a>
            <a href="student_history.html" class="nav-item">⏱ History</a>
            <a href="student_notification.html" class="nav-item">🔔 Notifications</a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </aside>

    <!-- Overlay when sidebar is open -->
    <div id="sidebar-overlay" class="overlay hidden"></div>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <button id="menu-btn" class="menu-btn">
                <i class="fa-solid fa-bars"></i> Menu
            </button>
            <span class="portal-title">Webventory: Student Portal</span>
        </div>
        <div class="nav-right">
            <button class="notif-btn" aria-label="Notifications">
               🔔
            </button>
            
            <!-- Profile Dropdown Container -->
            <div class="profile-dropdown-container">
                <button id="profile-menu-btn" class="profile-btn">
                    <span class="avatar-initials" id="header-initials">S</span>
                    <span class="profile-text">Profile</span>
                    <i class="fa-solid fa-chevron-down chevron-icon"></i>
                </button>
                
                <!-- Dropdown Menu -->
                <div id="profile-dropdown" class="dropdown-menu hidden">
                    <a href="#" class="logout-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                        <span class="icon">↪</span> Logout
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="under-menu-bar">
            <a href="student_dashboard.html">
                <button type="button" class="back-btn"> ◄ Back</button>
            </a>
        </div>

        <div class="content-header">
            <div>
                <h1>Account Settings</h1>
                <p>Review and maintain your profile and contact information.</p>
            </div>
            <button id="edit-btn" class="btn-primary">Edit Account Settings</button>
        </div>

        <!-- Settings Card -->
        <div class="card">
            <div class="user-header">
                <div class="user-avatar-large" id="avatar-large">--</div>
                <div class="user-info">
                    <h2 id="user-name">Loading…</h2>
                    <span class="user-role">Student</span>
                </div>
            </div>

            <hr class="divider">

            <!-- Profile Form Fields -->
            <form id="settings-form" class="form-grid" onsubmit="return false;">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" value="" disabled>
                </div>
                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" value="" maxlength="8" disabled>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" value="" disabled>
                </div>
                <div class="form-group">
                    <label for="mobile-number">Mobile Number</label>
                    <input type="text" id="mobile-number" value="" disabled>
                </div>
                <div class="form-group">
                    <label for="campus">Campus</label>
                    <select id="campus" disabled>
                        <option value="UC-Main">UC-Main</option>
                        <option value="UC-Pri">UC-Pri</option>
                        <option value="UC-Banilad">UC-Banilad</option>
                        <option value="UC-LM">UC-LM</option>
                        <option value="UC-PT">UC-PT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="academic-level">Academic Level</label>
                    <select id="academic-level" disabled>
                        <option value="Senior High">Senior High</option>
                        <option value="College">College</option>
                        <option value="Graduate School">Graduate School</option>
                    </select>
                </div>
            </form>
            <p id="settings-message" style="display:none; margin-top:14px; font-size:14px;"></p>
        </div>
    </main>

    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'student_dashboard.html';
            }
        }
    </script>
    <script src="../../static/script/student_script/account_setting/student_all_in_one.js"></script>
    <script src="../../static/script/auth.js?v=2"></script>
    
</body>
</html>
