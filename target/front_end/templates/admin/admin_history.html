<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webventory: Admin Portal - History</title>
    <link rel="stylesheet" href="../../static/css/admin_style/history/admin_history_body.css">
</head>
<body>

    <!-- Sidebar Navigation Drawer Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar Navigation Drawer -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="sidebar-logo">W</div>
                <div>
                    <h3>Webventory</h3>
                    <span>Administrator</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="close-btn">Close</button>
        </div>
        <div class="sidebar-menu">
            <a href="admin_dashboard.html" class="menu-item"><span class="icon">田</span> Dashboard</a>
            <a href="admin_user.html" class="menu-item"><span class="icon">👥</span> Users</a>
            <a href="admin_inventory.html" class="menu-item"><span class="icon">📋</span> Inventory</a>
            <a href="admin_categories.html" class="menu-item"><span class="icon">📁</span> Categories</a>
            <a href="admin_reports.html" class="menu-item"><span class="icon">📊</span> Reports</a>
            <a href="admin_history.html" class="menu-item active"><span class="icon">⏱️</span> History</a>
            <a href="admin_audit_trail.html" class="menu-item"><span class="icon">🔍</span> Audit Trail</a>
            <a href="admin_accountability.html" class="menu-item"><span class="icon">⚠️</span> Accountability</a>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Top Navigation Header -->
    <header class="header">
        <div class="header-left">
            <button id="menu-btn" class="menu-btn" onclick="toggleSidebar()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span>Menu</span>
            </button>
            <span class="divider">|</span>
            <h1>Webventory: Admin Portal</h1>
        </div>
        <div class="header-right">
            <!-- Notification Dropdown Container -->
            <div class="dropdown-container">
                <button class="notification-btn" onclick="toggleNotificationDropdown()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span class="notification-dot" id="notif-dot"></span>
                </button>
                <div id="notification-dropdown" class="dropdown-menu notification-menu">
                    <div class="notif-tabs">
                        <button class="tab-btn active" onclick="switchNotifTab('all')">All</button>
                        <button class="tab-btn" onclick="switchNotifTab('unread')">Unread</button>
                        <button class="tab-btn" onclick="switchNotifTab('alerts')">Alerts</button>
                    </div>
                    <div class="notif-list" id="notif-list-container">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Profile Dropdown Container -->
            <div class="dropdown-container">
                <div class="profile-section" onclick="toggleProfileDropdown()">
                    <div class="avatar">AD</div>
                    <span>Profile</span>
                </div>
                <div id="profile-dropdown" class="dropdown-menu profile-menu">
                    <a href="admin_account_setting.html" class="dropdown-item">Account Settings</a>
                    <a href="#" class="dropdown-item text-red">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">

        <!-- Page Title & Subtitle -->
        <div class="page-top-bar">
            <div>
                <h2>History</h2>
                <p>System activity log — filtered view</p>
            </div>
        </div>

        <!-- Filters Bar -->
        <div class="filters-bar">
            <div class="filter-group select-group">
                <select id="type-filter" onchange="applyFilters()">
                    <option value="All">All</option>
                    <option value="Date & Time">Date & Time</option>
                    <option value="Cancellation Request">Cancellation Request</option>
                    <option value="Borrow Request">Borrow Request</option>
                    <option value="Item Update">Item Update</option>
                </select>
            </div>
            <div class="filter-group date-group">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <input type="text" id="date-filter" value="23/09/2026" oninput="applyFilters()">
            </div>
            <div class="filter-group search-group">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-filter" placeholder="Search..." oninput="applyFilters()">
            </div>
        </div>

        <!-- History Table Section -->
        <div class="table-container">
            <div class="table-responsive">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Type</th>
                            <th>Student</th>
                            <th>Item</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="../../static/script/admin_script/history/admin_histoy.js"></script>
</body>
</html>
