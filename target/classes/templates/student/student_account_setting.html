<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../static/css/student_style/account_setting/student_account_setting_body.css">

    <title>Webventory: Student Portal</title>

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar Menu Drawer -->
    <aside id="sidebar" class="sidebar closed">
        <div class="sidebar-header">
            <div class="brand-title">
                <span class="logo-icon">W</span>
                <div>
                    <h3>Webventory</h3>
                    <p>Student</p>
                </div>
            </div>
            <button id="close-sidebar-btn" class="close-btn">Close</button>
        </div>
        <nav class="sidebar-nav">
            <a href="../../../html_files/student_page/student_dashboard.html" class="nav-item"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
            <a href="student_account_setting.html" class="nav-item"><i class="fa-solid fa-box-open"></i> Browse items</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-clipboard-list"></i> My Borrowings</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-bell"></i> Notifications</a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </aside>

    <!-- Overlay when sidebar is open -->
    <div id="sidebar-overlay" class="overlay hidden"></div>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <button id="menu-btn" class="menu-btn">
                <i class="fa-solid fa-bars"></i> Menu
            </button>
            <span class="portal-title">Webventory: Student Portal</span>
        </div>
        <div class="nav-right">
            <button class="notif-btn" aria-label="Notifications">
                <i class="fa-regular fa-bell"></i>
            </button>
            
            <!-- Profile Dropdown Container -->
            <div class="profile-dropdown-container">
                <button id="profile-menu-btn" class="profile-btn">
                    <span class="avatar-initials">JD</span>
                    <span class="profile-text">Profile</span>
                    <i class="fa-solid fa-chevron-down chevron-icon"></i>
                </button>
                
                <!-- Dropdown Menu -->
                <div id="profile-dropdown" class="dropdown-menu hidden">
                    <a href="#account-settings" class="dropdown-item">Account Settings</a>
                    <a href="#logout" class="dropdown-item">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="content-header">
            <div>
                <h1>Account Settings</h1>
                <p>Review and maintain your profile and contact information.</p>
            </div>
            <button id="edit-btn" class="btn-primary">Edit Account Settings</button>
        </div>

        <!-- Settings Card -->
        <div class="card">
            <div class="user-header">
                <div class="user-avatar-large">JS</div>
                <div class="user-info">
                    <h2>Juan Santos Dela Cruz</h2>
                    <span class="user-role">Student</span>
                </div>
            </div>

            <hr class="divider">

            <!-- Profile Form Fields -->
            <form id="settings-form" class="form-grid">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" value="Juan Santos Dela Cruz" disabled>
                </div>
                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" value="20240001" disabled>
                </div>
                <div class="form-group">
                    <label for="mobile-number">Mobile Number</label>
                    <input type="text" id="mobile-number" value="09171234567" disabled>
                </div>
                <div class="form-group">
                    <label for="campus">Campus</label>
                    <input type="text" id="campus" value="UC-MAIN" disabled>
                </div>
                <div class="form-group">
                    <label for="academic-level">Academic Level</label>
                    <input type="text" id="academic-level" value="College" disabled>
                </div>
            </form>
        </div>
    </main>

    <script src="../../static/script/student_script/account_setting/student_all_in_one.js"></script>
</body>
</html>
