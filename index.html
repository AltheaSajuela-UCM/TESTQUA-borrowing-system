<!DOCTYPE html>
<html lang="en">
<head>

    <title>Webventory Local Preview</title>

<body>
    <main>

                <h2>Administrator</h2>
                <a href="target/classes/templates/admin/admin_dashboard.html">Dashboard</a>

            <article>
                <h2>Student</h2>

            <article>

</html>
